# 控制台的 nginx 反代。
#
# ── 先说清这会改变什么 ─────────────────────────────────────────────
#
# ADR-0013 定的准入是「只绑内网或回环 + 会话 Cookie + 全写审计」，
# 远程访问走 SSH 隧道。**前置反代并把它暴露出去，就是换掉了第一条。**
#
# 那条 ADR 反对前置 Caddy 的两个理由，只有一个对 nginx 成立：
#
#   ✗ 「主控上的 Caddy 和节点上的 Caddy 会被混为一谈」—— nginx 不会
#   ✓ 「机器上多一个要跟版本、要打 CVE 的组件」        —— 仍然成立
#
# 所以这不是被禁止的做法，但它把「只绑内网」这条准入换成了
# 「nginx 的 TLS 配置 + 你在 nginx 上加的任何访问控制」。**换掉之后
# 那一条的强度取决于下面这个文件，而不再取决于网络位置。**
#
# ── 主控那边要配两个变量 ───────────────────────────────────────────
#
#   EC_SECURE_COOKIE=1
#     nginx 终止 TLS，主控自己看到的是 HTTP，它不知道浏览器走的是 HTTPS。
#     不设的话会话 Cookie 不带 Secure 标志 —— 它仍然能用，
#     所以**这个疏漏不会有任何症状**。
#
#   EC_TRUSTED_PROXIES=127.0.0.1
#     不设的话，审计日志里的来源 IP **全部**变成 127.0.0.1（nginx 自己）。
#     而主控默认谁也不信是有理由的：gin 的默认是信任所有代理，那时
#     任何人发一个 X-Forwarded-For 就能伪造审计里的来源 IP。
#
# ── 证书 ───────────────────────────────────────────────────────────
#
# 这份配置假定证书由 certbot 之类另外签发。**不要用本系统签的证书**：
# 那两套 CA 是给隧道和回源用的内部 PKI，浏览器不认它们。

upstream edge_master {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;

    # HTTP 一律跳 HTTPS。不留任何 HTTP 入口 —— 会话 Cookie 带了 Secure
    # 之后不会在 http:// 上发送，人会看到「登录成功但立刻跳回登录页」，
    # 而那个现象跟证书、跟 nginx 都无关，最难查。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 控制台不是公开站点，不该被搜到，也不该被别人嵌进 iframe。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;

    # 下发一份配置可能有几百 KB，预览返回的是两份全文。
    client_max_body_size 8m;

    # ── WebSocket ─────────────────────────────────────────────────
    #
    # /ws 推的是心跳与下发进度。**它必须单独写一段**：Upgrade 与
    # Connection 头不会被下面那个 location 继承过去，而漏了它的表现是
    # 「页面能开、数字不动」—— 看起来像后端没在推，而实际上是这里没让它升级。
    location = /ws {
        proxy_pass http://edge_master;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 心跳周期是秒级，但下发进度之间可能安静几十秒。
        # 默认 60s 会把连着的会话踢掉，而前端会降级成 2 秒轮询 ——
        # **那个降级是无声的**，界面照常更新，只是慢了。
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # ── 其余全部转给主控 ──────────────────────────────────────────
    #
    # 静态文件也走这里：**主控自己伺服控制台**，不要在 nginx 上用 root/alias
    # 直接指向前端产物。那样会绕开主控的单页 fallback 与 /assets 404 处理，
    # 而两处各有一套规则的结果是它们迟早不一致。
    location / {
        proxy_pass http://edge_master;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 下发是同步的：广播到各节点、逐个等回报之后才返回。
        # 节点多或者有节点在重试时，它会比一般请求久得多。
        proxy_read_timeout 120s;

        proxy_buffering off;   # 进度类响应要即时到达
    }
}
