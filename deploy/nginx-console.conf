# 控制台的 nginx 反代。
#
# ── 先说清这会改变什么 ─────────────────────────────────────────────
#
# ADR-0013 定的准入是「只绑内网或回环 + 会话 Cookie + 全写审计」，
# 远程访问走 SSH 隧道。**前置反代并把它暴露出去，就是换掉了第一条。**
#
# 那条 ADR 反对前置 Caddy 的两个理由，只有一个对 nginx 成立：
#
#   ✗ 「主控上的 Caddy 和节点上的 Caddy 会被混为一谈」—— nginx 不会
#   ✓ 「机器上多一个要跟版本、要打 CVE 的组件」        —— 仍然成立
#
# 所以这不是被禁止的做法，但它把「只绑内网」这条准入换成了
# 「nginx 的 TLS 配置 + 你在 nginx 上加的任何访问控制」。**换掉之后
# 那一条的强度取决于下面这个文件，而不再取决于网络位置。**
#
# ── 主控那边要配两个变量 ───────────────────────────────────────────
#
#   EC_SECURE_COOKIE=1
#     nginx 终止 TLS，主控自己看到的是 HTTP，它不知道浏览器走的是 HTTPS。
#     不设的话会话 Cookie 不带 Secure 标志 —— 它仍然能用，
#     所以**这个疏漏不会有任何症状**。
#
#   EC_TRUSTED_PROXIES=127.0.0.1
#     不设的话，审计日志里的来源 IP **全部**变成 127.0.0.1（nginx 自己）。
#     而主控默认谁也不信是有理由的：gin 的默认是信任所有代理，那时
#     任何人发一个 X-Forwarded-For 就能伪造审计里的来源 IP。
#
# ── 证书 ───────────────────────────────────────────────────────────
#
# 这份配置假定证书由 certbot 之类另外签发。**不要用本系统签的证书**：
# 那两套 CA 是给隧道和回源用的内部 PKI，浏览器不认它们。

# ── 来源 IP：只转一个值，而不是一条链 ─────────────────────────────
#
# 下面每个 location 用的是 `X-Forwarded-For $remote_addr`（**替换**），
# 不是 `$proxy_add_x_forwarded_for`（追加）。区别在失败面：
#
#   追加 → 主控收到 `<访问者自己写的>, <真实来源>`，得从右往左走，
#          而走对的前提是可信代理名单一个不漏。漏一个就取到攻击者写的值。
#   替换 → 主控只收到一个值，链上根本没有访问者写的部分可解读。
#
# **选让问题不存在，而不是把问题处理对。**
# 代价是丢掉上游链条——而那条链本来就是攻击者可写的，留着只是噪音。

# ── Cloudflare（或别的 CDN）在前面时 ───────────────────────────────
#
# **不在 CDN 后面就把这一段整个删掉。**
#
# 在 CDN 后面时，`$remote_addr` 是 CDN 边缘节点的地址，不是访问者的。
# 不处理的话审计日志里每一条都记着 CDN 的 IP —— 那比记 nginx 自己
# 还糟一点：它看起来像一个真实的公网地址，人不会怀疑它。
#
# real_ip 模块把 `$remote_addr` 换成 CF-Connecting-IP 的值，
# **但只对来自 set_real_ip_from 列出的那些地址生效**。
# 所以绕过 CDN 直连源站的人伪造不了它：他的对端地址不在那张表里。
#
# 那张表由 deploy/cf-realip.sh 从 Cloudflare 公布的列表生成。
# **不要手抄一份 IP 段进来** —— 它会过期，而过期的表现是
# 「某些访问者的 IP 又变回 CDN 的地址」，没有任何东西会报错。
#
# 文件不存在时这一段整体失效，`$remote_addr` 退回 CDN 的地址：
# **降级，而不是变得可伪造**。
include /etc/nginx/conf.d/cloudflare-realip.conf*;
real_ip_header CF-Connecting-IP;
# recursive off：CF-Connecting-IP 本来就只有一个值，不需要回溯，
# 而开着它会让 XFF 也参与计算 —— 那就把刚关上的那扇门又开了一条缝。
real_ip_recursive off;

upstream edge_master {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;

    # HTTP 一律跳 HTTPS。不留任何 HTTP 入口 —— 会话 Cookie 带了 Secure
    # 之后不会在 http:// 上发送，人会看到「登录成功但立刻跳回登录页」，
    # 而那个现象跟证书、跟 nginx 都无关，最难查。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 控制台不是公开站点，不该被搜到，也不该被别人嵌进 iframe。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;

    # 下发一份配置可能有几百 KB，预览返回的是两份全文。
    client_max_body_size 8m;

    # ── WebSocket ─────────────────────────────────────────────────
    #
    # 路径是 /api/v1/ws，**不是 /ws**（契约 §2）。写错的话这一段匹配不到
    # 任何东西，请求掉进下面那个 location —— 而那里有一句
    # `proxy_set_header Connection ""`，会把升级头**主动清掉**。
    #
    # 它必须单独写一段：Upgrade 与 Connection 头不会被下面那个 location
    # 继承过去，而漏了它的表现是「页面能开、数字不动」——
    # 看起来像后端没在推，而实际上是这里没让它升级。
    # ── 节点隧道 ──────────────────────────────────────────────────
    #
    # **这条比控制台那条 WS 更要紧**：它是节点接入的唯一通道。
    # 漏了它，节点装完一切正常、**永远不出现在控制台里**，
    # 而那台机器上没有任何东西说得出为什么。
    #
    # 两处与上面那条不同：
    #
    #   1) 超时给得很长。隧道是长连接，安静几分钟是常态（没有配置要下发时
    #      只有心跳）。默认 60s 会周期性地掐断它，而节点会重连——
    #      **表现是节点反复上下线**，看起来像网络抖动。
    #   2) proxy_buffering off。隧道是双向流，缓冲会把下发指令攒住，
    #      表现是「下发卡住然后突然全部完成」。
    location = /api/v1/tunnel {
        proxy_pass http://edge_master;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location = /api/v1/ws {
        proxy_pass http://edge_master;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 心跳周期是秒级，但下发进度之间可能安静几十秒。
        # 默认 60s 会把连着的会话踢掉，而前端会降级成 2 秒轮询 ——
        # **那个降级是无声的**，界面照常更新，只是慢了。
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # ── 其余全部转给主控 ──────────────────────────────────────────
    #
    # 静态文件也走这里：**主控自己伺服控制台**，不要在 nginx 上用 root/alias
    # 直接指向前端产物。那样会绕开主控的单页 fallback 与 /assets 404 处理，
    # 而两处各有一套规则的结果是它们迟早不一致。
    location / {
        proxy_pass http://edge_master;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 下发是同步的：广播到各节点、逐个等回报之后才返回。
        # 节点多或者有节点在重试时，它会比一般请求久得多。
        proxy_read_timeout 120s;

        proxy_buffering off;   # 进度类响应要即时到达
    }
}
