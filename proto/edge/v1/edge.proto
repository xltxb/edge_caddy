syntax = "proto3";

package edge.v1;

// EdgeEnroll 是接入用的一次性通道。
//
// 节点首连时还没有隧道证书，因此不能用 mTLS 客户端认证（docs/adr/0009）。
// 这个服务跑在服务端单向 TLS 上，用一次性 Token 换取隧道客户端证书；
// 之后该节点的所有连接都走 mTLS，不再触碰这个服务。
service EdgeEnroll {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  string node_id = 1;
  string token = 2;
}

message EnrollResponse {
  // 隧道客户端证书与私钥。私钥只在这一次传输，主控不保留。
  bytes cert_pem = 1;
  bytes key_pem = 2;
  // 主控的隧道 CA 根证书，节点用它校验主控。
  bytes ca_pem = 3;
}

// EdgeTunnel 是节点与主控之间的长连接。Agent 主动外连，穿透 NAT。
//
// 这个服务**要求 mTLS**：调用方必须出示由隧道 CA 签发的客户端证书。
service EdgeTunnel {
  rpc Channel(stream AgentMsg) returns (stream MasterMsg);
}

message AgentMsg {
  oneof m {
    Heartbeat hb = 1;
    PushResult push_result = 2;
    ProbeResult probe_result = 3;
  }
}

message MasterMsg {
  oneof m {
    PushConfig push = 1;
    Probe probe = 2;
  }
}

// Probe 是主控发起的一次往返探活。
//
// id 用于把回报与请求配对：同一节点上可能有多次探活在飞，
// 没有配对的话第二次探活会拿到第一次的回报，时延就成了随机数。
message Probe {
  string id = 1;
}

// ProbeResult 是节点对探活的回报。
//
// 它同时承载节点行展开要显示的三样东西。合并成一次往返而不是三个接口，
// 是因为它们描述的是**同一时刻**的节点状态——分三次取会各自看到不同的瞬间。
message ProbeResult {
  string id = 1;
  // 节点当前生效的配置版本。与主控基线不一致即为漂移。
  string cfg_version = 2;
  // 节点上的 Caddy Admin 是否可达。它与「隧道是否通」是两件事：
  // 前者去那台机器把 Caddy 拉起来，后者去查网络。
  bool caddy_ok = 3;
  string caddy_detail = 4;
  // Agent 最近日志，最新的在最后。
  repeated string logs = 5;
  // 节点上 Caddy 实际加载的证书清单。
  //
  // 证书状态**不落库**（PRD §4）：落库只会得到一份随时可能过时的副本，
  // 而「过时的证书状态」比没有更危险——它会让人以为一张已经换掉的证书
  // 还在生效。这里上报的是节点此刻真正加载着的那些。
  repeated LoadedCert certs = 6;
}

message LoadedCert {
  string domain = 1;
  // not_after 是 RFC3339 时间串。用字符串而不是时间戳：排查时人要直接看它，
  // 而一串秒数得先换算。
  string not_after = 2;
  string issuer = 3;
  string key_type = 4;
  string serial = 5;
}

// Heartbeat 刻意**不含 node_id**。
//
// 后端开发文档 §5 的草案里有这个字段，但在 mTLS 之上它是危险的冗余：身份应当
// 只有一个来源——客户端证书的主体。留一个可自报的 node_id 字段，等于给出第二个
// 来源，而两个来源迟早会不一致，届时「以哪个为准」就成了一个能被利用的问题。
message Heartbeat {
  double cpu = 1;
  double mem = 2;
  uint32 conns = 3;
  // 节点当前生效的配置版本。主控据此判断配置漂移（只比版本号，docs/adr/0002）。
  string cfg_version = 4;
}

message PushConfig {
  string cfg_version = 1;
  // access_rules 是访问规则的 JSON。它不在 caddy_json 里——官方 Caddy 不认识
  // 这些规则，真正的验签发生在 Agent 的校验端点上（docs/adr/0003）。
  bytes access_rules = 4;
  // apps 子树的渲染产物。Agent 遍历顶层每个 app 逐个 POST 到
  // /config/apps/<name>，而不是整体 POST /config/apps。
  bytes caddy_json = 2;
  uint32 deadline_ms = 3;
  // 回源客户端证书。主控签发、24 小时有效，节点上不存在 CA 私钥
  // （docs/adr/0009）。随每次下发带上，Agent 落盘后 Caddy 从文件读。
  bytes upstream_cert = 5;
  bytes upstream_key = 6;
}

message PushResult {
  string cfg_version = 1;
  bool ok = 2;
  // 成功时是耗时（"31ms"），失败时是 Caddy 的原文报错。
  // 不做归类：实测 Caddy 对语法错误、未知 handler、字段类型错、端口占用一律
  // 返回 500，任何基于状态码的归类都是错的（docs/adr/0005）。
  string detail = 3;
}
